<!DOCTYPE html>
<html lang="en" xmlns:f="http://typo3.org/ns/TYPO3Fluid/Fluid/ViewHelpers">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Visual Diff Report</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: rgba(255, 255, 255, 0.92);
            --panel-strong: #ffffff;
            --text: #132238;
            --muted: #617089;
            --border: #d8e0eb;
            --link: #1d4ed8;
            --green: #16a34a;
            --yellow: #d97706;
            --red: #dc2626;
            --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(29, 78, 216, 0.08), transparent 28%),
                radial-gradient(circle at top right, rgba(22, 163, 74, 0.08), transparent 30%),
                var(--bg);
        }

        .report-shell {
            max-width: 1480px;
            margin: 0 auto;
            padding: 32px 24px 48px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 24px;
            margin-bottom: 24px;
        }

        .page-title {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
        }

        .page-subtitle {
            margin: 10px 0 0;
            color: var(--muted);
            max-width: 70ch;
        }

        .report-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            backdrop-filter: blur(16px);
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: linear-gradient(to bottom, #ffffff, #f7f9fc);
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.72rem;
            text-align: left;
            padding: 16px 14px;
            border-bottom: 1px solid var(--border);
        }

        tbody td {
            border-bottom: 1px solid rgba(216, 224, 235, 0.8);
            padding: 16px 14px;
            vertical-align: top;
        }

        tbody tr:hover td {
            background: rgba(29, 78, 216, 0.03);
        }

        .status-col {
            width: 54px;
        }

        .status-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 999px;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.78),
                inset 0 -2px 4px rgba(0, 0, 0, 0.18),
                0 1px 2px rgba(15, 23, 42, 0.15);
        }

        .status-dot--matching {
            background: radial-gradient(circle at 30% 30%, #dcfce7 0%, #4ade80 50%, #16a34a 100%);
        }

        .status-dot--different {
            background: radial-gradient(circle at 30% 30%, #fef3c7 0%, #fbbf24 52%, #d97706 100%);
        }

        .status-dot--http-error,
        .status-dot--runtime-error,
        .status-dot--skipped {
            background: radial-gradient(circle at 30% 30%, #fecaca 0%, #f87171 52%, #dc2626 100%);
        }

        .status-text {
            font-weight: 600;
            white-space: nowrap;
        }

        .http-status {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            white-space: nowrap;
        }

        .page-cell .page-title {
            margin: 0;
            font-size: 0.98rem;
            letter-spacing: -0.02em;
        }

        .page-cell .page-path {
            margin-top: 5px;
            color: var(--muted);
            font-size: 0.88rem;
            overflow-wrap: anywhere;
        }

        .artifact-link,
        .page-link {
            color: var(--link);
            text-decoration: none;
            font-weight: 600;
        }

        .artifact-link:hover,
        .page-link:hover {
            text-decoration: underline;
        }

        .empty-cell {
            color: var(--muted);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .summary-item {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px 16px;
        }

        .summary-label {
            display: block;
            color: var(--muted);
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .summary-value {
            display: block;
            margin-top: 6px;
            font-size: 0.96rem;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .table-note {
            padding: 0 0 18px;
            color: var(--muted);
        }

        @media (max-width: 960px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
<main class="report-shell">
    <header class="page-header">
        <div>
            <h1 class="page-title">Local Visual Diff Report</h1>
            <p class="page-subtitle">
                A static review page for comparing a baseline site against a candidate site using visual screenshots.
            </p>
        </div>
    </header>

    <section class="report-card">
        <f:render partial="Summary" arguments="{summary: summary}" />

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th class="status-col">Status</th>
                    <th>Result</th>
                    <th>HTTP</th>
                    <th>Page title</th>
                    <th>Baseline</th>
                    <th>Candidate</th>
                    <th>Baseline shot</th>
                    <th>Candidate shot</th>
                    <th>Diff</th>
                    <th>Context</th>
                </tr>
                </thead>
                <tbody>
                <f:if condition="{results}">
                    <f:then>
                        <f:for each="{results}" as="result">
                            <f:render partial="ResultRow" arguments="{result: result}" />
                        </f:for>
                    </f:then>
                    <f:else>
                        <tr>
                            <td colspan="10" class="empty-cell">No pages were processed.</td>
                        </tr>
                    </f:else>
                </f:if>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
