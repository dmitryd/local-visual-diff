; Shared runtime defaults for the visual diff tool.
; Machine-specific overrides can live in config/local.ini.

[browser]
path = "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser"
accept_language = "de, en"
viewport_width = 1440
viewport_height = 900
settle_ms = 1000
timeout_ms = 30000
scroll_warmup = false
max_fullpage_height = 0
context_padding = 200

[compare]
shift_tolerance = 0
color_threshold = 0
overlay_opacity = 0.5

[crawl]
crawl_homepage_links = true
ignored_query_param_name_pattern = ""
fetch_verify_tls = false
max_pages = 0

[report]
output_dir = "var/results"
artifact_image_format = "webp"

[run]
capture_matching_screenshots = false
overwrite = false
